# Screen camera: the screen's own camera as a camera in Home Assistant. The picture is made on the screen in hardware
# (the ESP32-P4's image processor and JPEG encoder, ESPHome's camera API), only when Home Assistant asks for one; a
# camera in the top bar shows while it does. It drives the board's camera sensor (the feature camera_sensor: the
# board powers it and names its I2C bus), and brings the camera as `ts_camera` for a plugin that builds on it.
id: screen_camera
version: 0.3.0
api: "0.8"
icon: cctv
maintainer: MaxGramser
license: GPL-3.0-only
stage: beta
topics: [home]
requires:
  esphome: 2026.9.0
  psram: true
  features: [camera_sensor]
provides: [camera]
boards: any
flash_kb: 300

bar_items:
  - { id: watching, label: bar_watching, icon: cctv, example: bar_example }
