# index.json again, committed by the workflow when it changed, so the app sees a new release: after a push to main that
# changes a plugin, a community entry or the blocked list, and every hour for the community plugins that follow their
# newest release, so a maker's release reaches the app without a pull request. Each plugin of plugins/ is pinned to
# the last commit that changed its folder, each community plugin to its release's commit (tools/build_index.py).
name: index
on:
  push:
    branches: [main]
    paths: ["plugins/**", "community/**", "blocked.yaml", "tools/build_index.py"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: index
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/build_index.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # GitHub's API for the newest releases, without its hourly limit
      - name: Commit index.json when it changed
        run: |
          if ! git diff --quiet index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "Index: rebuilt for ${GITHUB_SHA::7}"
            git push
          fi
