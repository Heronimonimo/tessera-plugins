# What a screen gets when it takes this plugin: its camera sensor as ESPHome's camera, which Home Assistant shows as a
# camera of the screen's device, and the camera in the top bar while Home Assistant takes pictures. The sensor is the
# board's (the feature camera_sensor): the board file powers it, names its I2C bus in CAMERA_I2C and the pin that clocks
# it in CAMERA_XCLK_PIN (-1 for a sensor with its own clock), so nothing here owns a pin.

# The sensor through the ESP32-P4's camera interface, image processor and hardware JPEG encoder (Espressif's esp_video).
# Pictures are made only while Home Assistant asks for them, at most five a second; the pipeline rests five seconds
# after the last one.
esp_video_camera:
  id: ts_camera
  name: "Camera"
  i2c_id: ${CAMERA_I2C}
  enable_xclk: ${ "true" if (CAMERA_XCLK_PIN | int) >= 0 else "false" }
  xclk_pin: ${CAMERA_XCLK_PIN}
  device: jpeg
  resolution: auto
  jpeg_quality: 12
  max_framerate: 5

# The room's light level and motion, worked out on the screen from the camera's frames: no picture leaves the screen for
# them. Off until a person switches it on, because the camera then keeps running (at the frame rate above); an eye can
# show in the top bar while it does.
switch:
  - platform: template
    id: screen_camera_sensing
    name: "Camera light level and motion"
    icon: mdi:motion-sensor
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    turn_on_action:
      - lambda: id(screen_camera_plugin).set_sensing(true);
    turn_off_action:
      - lambda: id(screen_camera_plugin).set_sensing(false);

screen_camera:
  id: screen_camera_plugin
  camera: ts_camera
  illuminance:
    name: "Light level"
  motion:
    name: "Motion"
    filters:
      - delayed_off: 10s
