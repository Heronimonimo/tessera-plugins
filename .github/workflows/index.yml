# index.json again, committed by the workflow when it changed, so the app sees a new release: after a push to main or dev
# (each branch has its own index: AGENTS.md, "Branches") that
# changes a plugin, a community entry, the blocked, featured or transfers list, and every hour for the community plugins
# that follow their newest release, so a maker's release reaches the app without a pull request. Each plugin of
# plugins/ is pinned to the last commit that changed its folder, each community plugin to its release's commit
# (tools/build_index.py). Every run also copies the likes from Tessera's website into likes.json (tools/build_likes.py),
# in the same commit; a commit of the workflow starts no other workflow.
name: index
on:
  push:
    branches: [main, dev]
    paths: ["plugins/**", "community/**", "blocked.yaml", "featured.yaml", "transfers.yaml", "tools/build_index.py"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: index
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/build_index.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # GitHub's API (releases, repository ids) without its hourly limit
          # Each index is checked against the Tessera its app builds: main's against the released core, dev's against dev.
          TESSERA_REF: ${{ github.ref_name == 'dev' && 'dev' || 'main' }}
      - run: python3 tools/build_likes.py
      - name: Commit index.json and likes.json when they changed
        run: |
          if ! git diff --quiet index.json likes.json; then
            if git diff --quiet index.json; then
              message="Index: likes"
            else
              message="Index: rebuilt for ${GITHUB_SHA::7}"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json likes.json
            git commit -m "$message"
            git push
          fi
