i2s_audio:
  - id: i2s_input                 # microphone bus = master (generates the clock)
    i2s_mclk_pin: GPIO13
    i2s_bclk_pin: { number: GPIO12, allow_other_uses: true }
    i2s_lrclk_pin: { number: GPIO10, allow_other_uses: true }
  - id: i2s_output                # speaker bus = secondary/slave
    i2s_bclk_pin: { number: GPIO12, allow_other_uses: true }
    i2s_lrclk_pin: { number: GPIO10, allow_other_uses: true }

audio_dac:
  - platform: es8311
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 16000
    use_microphone: true          # mic is on the ES8311's own ADC front end,
    mic_gain: 24dB                # no separate ES7210 on this board

microphone:
  - platform: i2s_audio
    id: es8311_microphone
    i2s_audio_id: i2s_input
    i2s_din_pin: GPIO11
    adc_type: external
    bits_per_sample: 16bit
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: p4_speaker
    i2s_audio_id: i2s_output
    i2s_dout_pin: GPIO9
    audio_dac: es8311_dac
    dac_type: external
    channel: mono                 # ES8311 is a mono codec
    i2s_mode: secondary           # slave to the mic bus's clock
    bits_per_sample: 16bit
    sample_rate: 16000

  - platform: mixer
    id: mixer_speaker_id
    output_speaker: p4_speaker
    source_speakers:
      - id: announcement_spk_mixer_input
      - id: media_spk_mixer_input

  - platform: resampler
    id: media_spk_resampling_input
    output_speaker: media_spk_mixer_input

  - platform: resampler
    id: announcement_spk_resampling_input
    output_speaker: announcement_spk_mixer_input

# The settings, kept on the screen and shown in Home Assistant, on the screen's settings page and in the editor.
switch:
  # Speaker enable on this hardware.
  - platform: template
    id: p4_microphone_mute
    name: "Microphone mute"
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  - platform: template
    id: p4_tap_sound
    name: "Tap sound"
    icon: mdi:gesture-tap
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

number:
  - platform: template
    id: p4_speaker_volume
    name: "Speaker volume"
    icon: mdi:volume-high
    optimistic: true
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 50
    restore_value: true
    unit_of_measurement: "%"
    entity_category: config

guition_v3_audio:
  speaker: p4_speaker
  microphone: es8311_microphone
  dac: es8311_dac
  mute: p4_microphone_mute
  tap_sound: p4_tap_sound
  volume: p4_speaker_volume
