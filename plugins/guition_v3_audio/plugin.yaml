# The GSL3680 touch controller uses 0x40 on this bus, so the ES7210 uses its alternate address.
audio_adc:
  - platform: es7210
    id: guition_v3_audio_adc
    i2c_id: touch_bus
    address: 0x41

audio_dac:
  - platform: es8311
    id: guition_v3_audio_dac
    i2c_id: touch_bus
    address: 0x18

i2s_audio:
  - id: guition_v3_audio_bus
    i2s_mclk_pin: GPIO13
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12

microphone:
  - platform: i2s_audio
    id: guition_v3_microphone
    i2s_audio_id: guition_v3_audio_bus
    i2s_din_pin: GPIO48
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external
    channel: right

speaker:
  - platform: i2s_audio
    id: guition_v3_i2s_speaker
    i2s_audio_id: guition_v3_audio_bus
    i2s_dout_pin: GPIO9
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: mono
    buffer_duration: 100ms
    audio_dac: guition_v3_audio_dac

  - platform: mixer
    id: guition_v3_mixing_speaker
    output_speaker: guition_v3_i2s_speaker
    source_speakers:
      - id: guition_v3_announcement_mixing_input
        timeout: never
      - id: guition_v3_media_mixing_input
        timeout: never

  - platform: resampler
    id: guition_v3_announcement_resampling_speaker
    output_speaker: guition_v3_announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: guition_v3_media_resampling_speaker
    output_speaker: guition_v3_media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

switch:
  - platform: template
    id: guition_v3_microphone_mute
    name: "Microphone mute"
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  - platform: template
    id: guition_v3_tap_sound
    name: "Tap sound"
    icon: mdi:gesture-tap
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

number:
  - platform: template
    id: guition_v3_speaker_volume
    name: "Speaker volume"
    icon: mdi:volume-high
    optimistic: true
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 50
    restore_value: true
    unit_of_measurement: "%"
    entity_category: config

guition_v3_audio:
  speaker: guition_v3_announcement_resampling_speaker
  microphone: guition_v3_microphone
  dac: guition_v3_audio_dac
  mute: guition_v3_microphone_mute
  tap_sound: guition_v3_tap_sound
  volume: guition_v3_speaker_volume
