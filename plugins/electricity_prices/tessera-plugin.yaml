# Every name in this manifest is a key in translations/<language>.json, part "app".
id: electricity_prices
version: 0.2.0
api: "0.5"
icon: flash
maintainer: Heronimonimo
license: MIT
stage: beta
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 8

tiles:
  - id: forecast
    name: tile_name
    icon: flash
    sizes: { min: 1x1, max: 3x2 }
    memory: 5000
    example: tile_example
    domains: [sensor]
    preview: { value: "{state}" }
    attributes: [unit_of_measurement, suggested_display_precision]
    fields:
      raw_today_prices: { path: "raw_today[*].value", as: numbers }
      raw_tomorrow_prices: { path: "raw_tomorrow[*].value", as: numbers }
      prices_today_values: { path: "prices_today[*].price", as: numbers }
      prices_tomorrow_values: { path: "prices_tomorrow[*].price", as: numbers }

cards:
  - { id: chart, name: card_name }
